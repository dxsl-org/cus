# Phase 19: combo-m-law-l1 started from combo-M's pre-decay weights (ckpt-stable.pt, step 6103) instead of the
# annealed final ones; every other setting is identical. combo-m-law-l1 lost 1.8% bpb/all, most on reference and
# literature, the domains the anneal mix up-weights: this run tells undoing the anneal apart from the re-warm LR,
# and tests the WSD route for domain adaptation (keep the stable checkpoint, decay on the domain mix).
model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  mup_base_width: 512
  gdn: {attention_every: 4}
  attn_gate: true
  mtp: {weight: 0.3}
  moe: {n_experts: 32, top_k: 4, n_shared: 1, expert_hidden: 416, balance: bias, bias_rate: 1.0e-3}
train:
  name: combo-m-law-l1-stable
  init_from: combo-m
  init_ckpt: ckpt-stable.pt
  mix: {law: 0.76, fineweb2_vie: 0.15, culturax_vi: 0.05, news: 0.02, reference: 0.005, forum: 0.005,
        literature: 0.005, health: 0.0025, culture_history: 0.00125, education: 0.00125}
  total_tokens: 3.0e8
  batch_tokens: 262144
  micro_batch: 2  # local 4070 (12 GB): 8 and 4 spill into shared memory, as in the combo-M LR checks
  lr: 9.0e-4
  warmup_steps: 50
  eval_every: 250
  ckpt_minutes: 15
  schedule: wsd
  decay_fraction: 0.2
  optimizer: muon
  muon_lr: 0.003
