# Phase 19: law adaptation L1 (law + 24% replay of the original mix) on combo-M, as law-l1-replay did on dense-M
# (bpb/law 0.5641 → 0.5236, bpb/all unchanged). 0.3B tokens, fresh optimizer re-warmed to 0.3x the main run's
# peak LRs, WSD without annealing (the adaptation mix is the target). Compare with law-l1-replay.
model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  mup_base_width: 512
  gdn: {attention_every: 4}
  attn_gate: true
  mtp: {weight: 0.3}
  moe: {n_experts: 32, top_k: 4, n_shared: 1, expert_hidden: 416, balance: bias, bias_rate: 1.0e-3}
train:
  name: combo-m-law-l1
  init_from: combo-m
  mix: {law: 0.76, fineweb2_vie: 0.15, culturax_vi: 0.05, news: 0.02, reference: 0.005, forum: 0.005,
        literature: 0.005, health: 0.0025, culture_history: 0.00125, education: 0.00125}
  total_tokens: 3.0e8
  batch_tokens: 262144
  micro_batch: 2  # local 4070 (12 GB): 8 and 4 spill into shared memory, as in the combo-M LR checks
  lr: 9.0e-4
  warmup_steps: 50
  eval_every: 250
  ckpt_minutes: 15
  schedule: wsd
  decay_fraction: 0.2
  optimizer: muon
  muon_lr: 0.003
