# Phase 19 follow-up: combo-m-law-l1 with 40% replay instead of 24%, keeping its 228M law tokens (0.6 × 3.8e8).
# The replay keeps the pretraining-mix proportions of combo-m-law-l1, scaled by 0.40/0.24; the extra replay is added
# on top rather than taken from law, so a lower bpb/all here is not paid for with less law. Compare with
# combo-m-law-l1 (forgot 1.8% bpb/all, most on reference and literature).
model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  mup_base_width: 512
  gdn: {attention_every: 4}
  attn_gate: true
  mtp: {weight: 0.3}
  moe: {n_experts: 32, top_k: 4, n_shared: 1, expert_hidden: 416, balance: bias, bias_rate: 1.0e-3}
train:
  name: combo-m-law-l1-replay40
  init_from: combo-m
  mix: {law: 0.6, fineweb2_vie: 0.25, culturax_vi: 0.08333, news: 0.03333, reference: 0.00833, forum: 0.00833,
        literature: 0.00833, health: 0.00417, culture_history: 0.00209, education: 0.00209}
  total_tokens: 3.8e8
  batch_tokens: 262144
  micro_batch: 2  # local 4070 (12 GB): 8 and 4 spill into shared memory, as in the combo-M LR checks
  lr: 9.0e-4
  warmup_steps: 50
  eval_every: 250
  ckpt_minutes: 15
  schedule: wsd
  decay_fraction: 0.2
  optimizer: muon
  muon_lr: 0.003
