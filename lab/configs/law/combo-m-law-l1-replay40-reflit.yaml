# Phase 19 follow-up: combo-m-law-l1-replay40 with the 40% replay reweighted towards reference and literature,
# the domains replay40 still forgot most (+6.0% and +4.2% bpb against combo-m). Same law tokens (228M), steps and
# schedule as replay40, so a paired comparison isolates the replay mix. reference 8% and literature 6% are about the
# shares that halved their forgetting in combo-m-law-l1-anneal-replay; forum is kept (dropping it cost +3.4%) and the
# web share (fineweb2 + culturax) shrinks from 33% to 19%, so web forgetting is the risk to watch.
model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  mup_base_width: 512
  gdn: {attention_every: 4}
  attn_gate: true
  mtp: {weight: 0.3}
  moe: {n_experts: 32, top_k: 4, n_shared: 1, expert_hidden: 416, balance: bias, bias_rate: 1.0e-3}
train:
  name: combo-m-law-l1-replay40-reflit
  init_from: combo-m
  mix: {law: 0.6, fineweb2_vie: 0.14, culturax_vi: 0.05, news: 0.04, reference: 0.08, literature: 0.06, forum: 0.015,
        health: 0.005, culture_history: 0.005, education: 0.005}
  total_tokens: 3.8e8
  batch_tokens: 262144
  micro_batch: 2  # local 4070 (12 GB): 8 and 4 spill into shared memory, as in the combo-M LR checks
  lr: 9.0e-4
  warmup_steps: 50
  eval_every: 250
  ckpt_minutes: 15
  schedule: wsd
  decay_fraction: 0.2
  optimizer: muon
  muon_lr: 0.003
