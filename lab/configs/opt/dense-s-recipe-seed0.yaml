# Phase 18 noise floor: the winning dense-S recipe (dense-s-muon-lr0.01-anneal, Modal H100: 0.7911) rerun on the
# 4070 with seeds 0/1/2 (seed sets init and data order). Spread across seeds = training noise; local seed 0
# vs the Modal run = environment effect (GPU, micro_batch). Compare with lab.compare_bpb.
model: {d_model: 512, n_layers: 8, n_heads: 8, n_kv_heads: 4}
train:
  name: dense-s-recipe-seed0
  seed: 0
  mix: {fineweb2_vie: 0.6, culturax_vi: 0.2, news: 0.08, law: 0.04, reference: 0.02, forum: 0.02,
        literature: 0.02, health: 0.01, culture_history: 0.005, education: 0.005}
  total_tokens: 5.0e8
  batch_tokens: 262144
  micro_batch: 16
  lr: 3.0e-3
  warmup_steps: 100
  eval_every: 250
  schedule: wsd
  decay_fraction: 0.2
  optimizer: muon
  muon_lr: 0.01
  anneal_mix: {reference: 0.25, literature: 0.2, news: 0.15, law: 0.1, fineweb2_vie: 0.1, culturax_vi: 0.05,
                 education: 0.05, health: 0.05, culture_history: 0.05}
