# Phase 18 E1: dense-S with a warmup-stable-decay schedule (1-sqrt decay over the last 20%) instead of cosine.
# Baseline: dense-s-full-lr3.0e-3 (cosine, same lr/tokens), bpb/all 0.8245.
model: {d_model: 512, n_layers: 8, n_heads: 8, n_kv_heads: 4}
train:
  name: dense-s-wsd
  mix: {fineweb2_vie: 0.6, culturax_vi: 0.2, news: 0.08, law: 0.04, reference: 0.02, forum: 0.02,
        literature: 0.02, health: 0.01, culture_history: 0.005, education: 0.005}
  total_tokens: 5.0e8
  batch_tokens: 262144
  micro_batch: 16
  lr: 3.0e-3
  warmup_steps: 100
  eval_every: 250
  schedule: wsd
  decay_fraction: 0.2
