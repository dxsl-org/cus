# Phase 15, size S (~40M params incl. 32k embedding): ablations and the LR sweep. lr comes from the sweep.
model: {d_model: 512, n_layers: 8, n_heads: 8, n_kv_heads: 4}
train:
  name: dense-s
  # fineweb2/culturax by source; the remaining 20% by domain, each spread over its sources by size.
  mix: {fineweb2_vie: 0.6, culturax_vi: 0.2, news: 0.08, law: 0.04, reference: 0.02, forum: 0.02,
        literature: 0.02, health: 0.01, culture_history: 0.005, education: 0.005}
  total_tokens: 5.0e8
  batch_tokens: 262144
  micro_batch: 16
  lr: 0.0015
  warmup_steps: 100
  eval_every: 250
