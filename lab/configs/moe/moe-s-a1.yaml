# Phase 16 ablation A1: 8 experts, top-2 (classic Switch/Mixtral shape), aux-loss balancing.
# Same as the dense-S baseline (dense-s-full-lr3.0e-3, bpb/all 0.8245) except the FFN: active FFN width 2×704 = 1408
# vs dense 1408, same 0.5B tokens and lr 3e-3, so bpb is compared at (almost) equal FLOPs.
model:
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  moe: {n_experts: 8, top_k: 2, expert_hidden: 704, balance: aux}
train:
  name: moe-s-a1
  mix: {fineweb2_vie: 0.6, culturax_vi: 0.2, news: 0.08, law: 0.04, reference: 0.02, forum: 0.02,
        literature: 0.02, health: 0.01, culture_history: 0.005, education: 0.005}
  total_tokens: 5.0e8
  batch_tokens: 262144
  micro_batch: 8  # 16 overflows 12 GB VRAM (eager dispatch); Windows then spills to RAM at ~4k tok/s
  lr: 3.0e-3
  warmup_steps: 100
  eval_every: 250
