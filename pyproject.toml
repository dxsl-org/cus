[project]
name = "cus"
version = "0.1.0"
description = "Cus: a Vietnamese-first LLM trained from scratch, with its data platform, evaluation and architecture lab."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cssselect>=1.6.0",
    "curl-cffi>=0.17.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "lxml>=6.1.3",
    "mobi>=0.4.1",
    "mwparserfromhell>=0.7.2",
    "pyarrow>=17",
    "pymupdf>=2.1",
    "pyyaml>=6",
    "selectolax>=1.0.2",
    "trafilatura>=2.3.1",
    "truststore>=0.10.5",
    "warcio>=1.8.2",
]

[dependency-groups]
# Lab training on Modal GPUs (lab/modal_train.py).
cloud = ["modal>=1.6.4"]
dev = ["pytest>=8"]
# Model evaluation and LLM labelling (eval/, pipeline/quality). Separate group: data pipelines never need torch.
eval = ["torch>=2.7", "transformers>=4.51", "accelerate>=1.6", "bitsandbytes>=0.45"]
# Architecture lab (phase 15–18): small models trained on the local GPU. triton-windows makes torch.compile
# work on native Windows; Linux/WSL gets triton from the torch wheel. flash-linear-attention: Triton kernels
# for Gated DeltaNet (phase 17), pinned because its op signatures change between releases. torch 2.12 because
# its Linux wheel pins Triton 3.7.1, the minimum fla accepts on Hopper (fla #640): Gated DeltaNet on H100.
lab = ["torch>=2.12.1,<2.13", "tokenizers>=0.21", "pyyaml>=6", "triton-windows; sys_platform == 'win32'",
       "flash-linear-attention==0.6.0"]
# Processing pipeline (pipeline/process, phase 6). datatrove core only: its [processing] extra pins an
# old trafilatura that the crawler cannot use. fasttext-predict: inference-only fastText with Windows wheels.
# xxhash<4: datatrove 0.10.1 hashes str, which xxhash 4 rejects ("Strings must be encoded").
process = ["datatrove>=0.10", "fasttext-predict>=0.9.2", "xxhash>=3.5,<4", "ftfy>=6.3", "scikit-learn>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
