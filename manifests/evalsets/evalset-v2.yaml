# Frozen Vietnamese-first eval set v2 (lab phase 17 onward). Built by `python -m eval.build_evalset evalset-v2`
# from reviewed TaskItems only (approved/corrected, no flags); immutable once built, like evalset-v1.
# v2 adds what small base models need and what separates close models: vn_facts (short facts with a cloze
# sentence, difficulty 1-5) and every Global-MMLU vi question; v1's groups are kept with the same items.
# Score base models with `--mode cloze`; compare two runs with `python -m eval.compare`.
# Group order matters: an item goes to the first group that selects it.
name: evalset-v2
sample_salt: "llm-evalset/v2"
groups:
  # New facts, never published: split holdout, drafted by Claude, reviewed one by one by anh.
  - {name: vn_facts, sources: [claude_drafts], meta: {set: vn_facts}}
  # All 14,042 Global-MMLU vi questions (v1 sampled 300): enough items for a ~1-point paired difference.
  - {name: vi_mmlu, sources: [global_mmlu], langs: [vi]}
  # The other 8 languages' samples (their question ids are a subset of vi_mmlu's).
  - {name: multilingual, sources: [global_mmlu]}
  - {name: vn_knowledge, sources: [vmlu]}
  - {name: reading, sources: [viquad2], sample: 500}
  - {name: code, sources: [humaneval, mbpp, claude_drafts], domains: [programming]}
  - {name: language, sources: [claude_drafts], domains: [language]}
  - {name: law, sources: [claude_drafts], domains: [law]}
  - {name: math, sources: [claude_drafts], domains: [math]}
